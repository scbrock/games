<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brick Press">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- ARTIFACT-START -->
<title>Brick Press</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen arcade app. A thin HUD strip, then the print bed (canvas)
   scaled to fit whatever height is left, thumb room under the paddle. */
:root {
  --paper: #e7eaee;
  --paper-edge: #d5dae1;
  --ink: #1e2340;
  --muted: #5b6178;
  --pink: #ff4f8b;
  --blue: #3255d6;
  --yellow: #ffcc2e;
  --scrim: rgba(231, 234, 238, .88);

  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15182b; --paper-edge: #23284a; --ink: #e8eaf6; --muted: #9ba1c2;
    --pink: #ff6b9e; --blue: #7590ff; --yellow: #ffd84d;
    --scrim: rgba(21, 24, 43, .88); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15182b; --paper-edge: #23284a; --ink: #e8eaf6; --muted: #9ba1c2;
  --pink: #ff6b9e; --blue: #7590ff; --yellow: #ffd84d;
  --scrim: rgba(21, 24, 43, .88); color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
.app {
  box-sizing: border-box;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-block: 12px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hud { display: flex; align-items: center; gap: 14px; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: 1.15rem;
  line-height: .95;
  letter-spacing: -.02em;
  text-shadow: 2px 1px 0 var(--pink);
  margin-right: auto;
}
.stat { display: grid; justify-items: end; line-height: 1; }
.stat b {
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat output {
  font-weight: 700;
  font-size: 1.45rem;
  font-variant-numeric: tabular-nums;
}
.lives { display: flex; gap: 4px; height: 1.45rem; align-items: center; }
.lives i { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 1.5px 1px 0 var(--pink); }
.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  padding: 0;
}
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
.icon-btn:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: grid;
  place-items: center;
  touch-action: none;
}
canvas {
  display: block;
  max-width: 100%;
  border-radius: 6px;
  box-shadow: 0 0 0 2px var(--paper-edge);
  touch-action: none;
}
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  text-align: center;
  padding: 24px;
  background: var(--scrim);
  border-radius: 6px;
}
.overlay h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.6rem, 9vw, 2.4rem);
  line-height: 1;
  letter-spacing: -.02em;
  text-wrap: balance;
  text-shadow: 3px 2px 0 var(--pink);
}
.overlay p { margin: 0; max-width: 30ch; font-size: 1.1rem; line-height: 1.35; color: var(--muted); }
.overlay p strong { color: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 1rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i {
  font-style: normal; font-weight: 700; font-size: .85rem;
  width: 26px; height: 16px; border-radius: 8px;
  display: grid; place-items: center;
  color: var(--paper); background: var(--blue); box-shadow: 1.5px 1px 0 var(--pink);
}
.go {
  font: inherit;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 12px 26px;
  border: 0;
  border-radius: 999px;
  background: var(--blue);
  color: var(--paper);
  box-shadow: 3px 2px 0 var(--pink);
  cursor: pointer;
}
.go:active { transform: translate(2px, 1px); box-shadow: 1px 1px 0 var(--pink); }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <h1>Brick<br>Press</h1>
    <div class="stat"><b>Level</b><output id="level">1</output></div>
    <div class="stat"><b>Balls</b><span class="lives" id="lives"></span></div>
    <div class="stat"><b>Score</b><output id="score">0</output></div>
    <button class="icon-btn" id="sound" type="button" aria-label="Sound on" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path id="sound-icon" d="M2 6h3l4-3v10l-4-3H2zM11 5.5c1 .7 1.5 1.5 1.5 2.5s-.5 1.8-1.5 2.5l-.8-.9c.6-.5.9-1 .9-1.6s-.3-1.1-.9-1.6z"/></svg>
    </button>
    <button class="icon-btn" id="pause" type="button" aria-label="Pause">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Breakout playfield" role="img"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Brick Press</h2>
      <p id="ov-text">Drag anywhere to move the paddle. Tap to launch. Clear every brick to print the next sheet.</p>
      <div class="legend" id="legend">
        <span><i>W</i>Wide paddle</span>
        <span><i>M</i>Three balls</span>
        <span><i>S</i>Slow ball</span>
      </div>
      <button class="go" id="ov-go" type="button">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
  // Logical playfield, scaled to fit the stage.
  const W = 360, H = 600;
  const COLS = 8, BW = 38.5, BH = 16, BGAP = 4, BX = 12, BY = 64;
  const PY = H - 78, PH = 11, PW = 66, PW_WIDE = 104;
  const R = 6;
  const MAX_ANGLE = Math.PI / 3;
  const STORE = "brick-press-v1";

  const LEVELS = [
    ["22222222", "11111111", "11111111", "11111111", "11111111"],
    ["...22...", "..1111..", ".111111.", "11111111", "22222222", "1.1..1.1"],
    ["2.2.2.2.", ".1.1.1.1", "2.2.2.2.", ".1.1.1.1", "2.2.2.2.", ".1.1.1.1"],
    [".22..22.", "21111112", "21111112", ".211112.", "..2112..", "...22..."],
    ["22222222", "2......2", "2.1111.2", "2.1111.2", "2......2", "22222222"],
  ];

  const $ = (id) => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const stage = $("stage");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let ink = {};
  function readInks() {
    const s = getComputedStyle(document.documentElement);
    for (const k of ["paper", "ink", "pink", "blue", "yellow", "muted"]) ink[k] = s.getPropertyValue("--" + k).trim();
    makeGrain();
  }

  // ---------- State ----------
  let g; // game
  let best = 0;
  let mode = "title"; // title | serve | play | paused | clear | over
  let muted = false;
  try { const saved = JSON.parse(localStorage.getItem(STORE)) || {}; best = saved.best || 0; muted = !!saved.muted; } catch {}
  const persist = () => { try { localStorage.setItem(STORE, JSON.stringify({ best, muted })); } catch {} };

  function newGame(from) {
    g = {
      level: from?.level || 1,
      score: from?.score || 0,
      lives: from?.lives ?? 3,
      bricks: [], balls: [], drops: [], bits: [],
      paddle: { x: W / 2, w: PW, wideUntil: 0 },
      slowUntil: 0, time: 0, shake: 0,
    };
    buildLevel();
  }

  function buildLevel() {
    const layout = LEVELS[(g.level - 1) % LEVELS.length];
    g.bricks = [];
    layout.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === ".") return;
        g.bricks.push({
          x: BX + c * (BW + BGAP), y: BY + r * (BH + BGAP), w: BW, h: BH,
          hp: +ch, max: +ch, row: r,
          ink: ch === "2" ? "blue" : r % 2 ? "yellow" : "pink",
        });
      });
    });
    g.drops = []; g.bits = [];
    g.paddle.w = PW; g.paddle.wideUntil = 0; g.slowUntil = 0;
    serve();
  }

  function serve() {
    g.balls = [{ x: g.paddle.x, y: PY - R - 1, vx: 0, vy: 0, stuck: true }];
    mode = mode === "title" || mode === "over" ? mode : "serve";
  }

  const baseSpeed = () => Math.min(300 + (g.level - 1) * 18, 470);

  function launch() {
    for (const b of g.balls) if (b.stuck) {
      const a = (Math.random() - 0.5) * 0.6;
      const s = baseSpeed();
      b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a); b.stuck = false;
    }
    mode = "play";
  }

  // ---------- Sound ----------
  let actx = null;
  function beep(freq, dur = 0.06, type = "square", vol = 0.05) {
    if (muted || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), v = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function unlockAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  }
  const PENTA = [392, 440, 523, 587, 659, 784];

  // ---------- Physics ----------
  function step(dt) {
    g.time += dt;
    const p = g.paddle;
    if (p.wideUntil && g.time > p.wideUntil) p.wideUntil = 0;
    const targetW = p.wideUntil ? PW_WIDE : PW;
    p.w += (targetW - p.w) * Math.min(1, dt * 10);
    p.x = clamp(p.x, p.w / 2 + 4, W - p.w / 2 - 4);

    const slow = g.slowUntil && g.time < g.slowUntil ? 0.65 : 1;
    if (g.slowUntil && g.time >= g.slowUntil) g.slowUntil = 0;

    for (const b of g.balls) {
      if (b.stuck) { b.x = p.x; b.y = PY - R - 1; continue; }
      const dist = Math.hypot(b.vx, b.vy) * slow * dt;
      const n = Math.max(1, Math.ceil(dist / 3));
      for (let i = 0; i < n && !b.dead; i++) sub(b, (dt * slow) / n);
    }
    const alive = g.balls.filter((b) => !b.dead);
    if (alive.length === 0 && g.balls.length) loseBall();
    else g.balls = alive;

    for (const d of g.drops) {
      d.y += 130 * dt;
      if (d.y + 8 > PY && d.y - 8 < PY + PH && Math.abs(d.x - p.x) < p.w / 2 + 14) { catchDrop(d); d.done = true; }
      if (d.y > H + 20) d.done = true;
    }
    g.drops = g.drops.filter((d) => !d.done);

    for (const s of g.bits) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt; }
    g.bits = g.bits.filter((s) => s.life > 0);
    g.shake = Math.max(0, g.shake - dt * 30);

    if (mode === "play" && g.bricks.length === 0) levelClear();
  }

  function sub(b, dt) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); beep(220, 0.03); }
    if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); beep(220, 0.03); }
    if (b.y < R) { b.y = R; b.vy = Math.abs(b.vy); beep(220, 0.03); }
    if (b.y > H + R * 2) { b.dead = true; return; }

    const p = g.paddle;
    if (b.vy > 0 && b.y + R >= PY && b.y + R <= PY + PH + 8 && Math.abs(b.x - p.x) <= p.w / 2 + R) {
      const rel = clamp((b.x - p.x) / (p.w / 2), -1, 1);
      const a = rel * MAX_ANGLE;
      const s = Math.min(Math.hypot(b.vx, b.vy) + 4, baseSpeed() + 120);
      b.vx = s * Math.sin(a); b.vy = -s * Math.cos(a);
      b.y = PY - R;
      beep(330, 0.05, "triangle", 0.08);
      return;
    }

    for (let i = 0; i < g.bricks.length; i++) {
      const k = g.bricks[i];
      const cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy > R * R) continue;
      if (Math.abs(dx) > Math.abs(dy)) { b.vx = Math.sign(dx) * Math.abs(b.vx); b.x = cx + Math.sign(dx) * R; }
      else { const sy = dy === 0 ? -Math.sign(b.vy) : Math.sign(dy); b.vy = sy * Math.abs(b.vy); b.y = cy + sy * R; }
      // Keep the ball from settling into a near-horizontal path.
      const s = Math.hypot(b.vx, b.vy);
      if (Math.abs(b.vy) < s * 0.25) { b.vy = Math.sign(b.vy || -1) * s * 0.25; b.vx = Math.sign(b.vx) * Math.sqrt(s * s - b.vy * b.vy); }
      hit(k, i);
      return;
    }
  }

  function hit(k, i) {
    k.hp--;
    beep(PENTA[(k.row + (k.hp ? 0 : 1)) % PENTA.length] * (k.hp ? 0.5 : 1), 0.07);
    if (k.hp > 0) { addScore(10); splat(k, 3); return; }
    g.bricks.splice(i, 1);
    addScore(k.max === 2 ? 50 : 20);
    splat(k, 9);
    g.shake = reduceMotion ? 0 : 3;
    if (Math.random() < 0.13) {
      const type = ["W", "M", "S"][Math.floor(Math.random() * 3)];
      g.drops.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, type });
    }
  }

  function splat(k, n) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      g.bits.push({
        x: k.x + Math.random() * k.w, y: k.y + Math.random() * k.h,
        vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120,
        s: 2 + Math.random() * 3, life: 0.5 + Math.random() * 0.3, ink: k.ink,
      });
    }
  }

  function catchDrop(d) {
    addScore(25);
    beep(784, 0.08, "triangle", 0.08); setTimeout(() => beep(1046, 0.1, "triangle", 0.08), 70);
    if (d.type === "W") g.paddle.wideUntil = g.time + 12;
    if (d.type === "S") g.slowUntil = g.time + 9;
    if (d.type === "M") {
      const extra = [];
      for (const b of g.balls) {
        if (b.stuck) continue;
        const s = Math.hypot(b.vx, b.vy), a = Math.atan2(b.vx, -b.vy);
        for (const da of [-0.45, 0.45]) extra.push({ x: b.x, y: b.y, vx: s * Math.sin(a + da), vy: -Math.abs(s * Math.cos(a + da)) });
      }
      g.balls.push(...extra.slice(0, 8));
    }
  }

  function loseBall() {
    g.lives--;
    beep(196, 0.25, "sawtooth", 0.06);
    g.shake = reduceMotion ? 0 : 6;
    g.drops = [];
    g.paddle.wideUntil = 0; g.slowUntil = 0;
    hud();
    if (g.lives <= 0) {
      g.balls = [];
      mode = "over";
      if (g.score > best) { best = g.score; persist(); }
      show("Out of balls", `You scored <strong>${g.score}</strong> on level ${g.level}. Best so far: <strong>${best}</strong>.`, "Play again", false);
    } else {
      serve();
    }
  }

  function levelClear() {
    mode = "clear";
    addScore(100 * g.level);
    beep(523, 0.1, "triangle", 0.08); setTimeout(() => beep(659, 0.1, "triangle", 0.08), 100); setTimeout(() => beep(784, 0.18, "triangle", 0.08), 200);
    show(`Sheet ${g.level} printed`, `Level bonus <strong>+${100 * g.level}</strong>. The next sheet runs a little faster.`, "Next level", false);
  }

  function addScore(n) {
    g.score += n;
    if (g.score > best) best = g.score;
    hud();
  }

  // ---------- Drawing ----------
  let scale = 1, dpr = 1, grain = null;

  function makeGrain() {
    grain = document.createElement("canvas");
    grain.width = W; grain.height = H;
    const gx = grain.getContext("2d");
    gx.fillStyle = ink.paper;
    for (let i = 0; i < 2600; i++) {
      gx.globalAlpha = 0.25 + Math.random() * 0.45;
      const s = Math.random() < 0.85 ? 0.7 : 1.4;
      gx.fillRect(Math.random() * W, Math.random() * H, s, s);
    }
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    scale = Math.max(0.3, Math.min(r.width / W, r.height / H));
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = W * scale + "px";
    canvas.style.height = H * scale + "px";
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    draw();
  }

  // Each shape prints twice: an off-register pass in a second ink, then the main ink.
  function print(shape, main, under, off = 1.6) {
    ctx.fillStyle = ink[under]; ctx.save(); ctx.translate(off, off * 0.6); shape(); ctx.restore();
    ctx.fillStyle = ink[main]; shape();
  }
  const rect = (x, y, w, h, rad = 2) => () => { ctx.beginPath(); ctx.roundRect(x, y, w, h, rad); ctx.fill(); };
  const disc = (x, y, r) => () => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

  function halftone(k) {
    ctx.fillStyle = ink.paper;
    for (let y = k.y + 3; y < k.y + k.h; y += 4.5)
      for (let x = k.x + 3 + ((y - k.y) % 9 ? 2.25 : 0); x < k.x + k.w - 1; x += 4.5) {
        ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill();
      }
  }

  function draw() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.fillStyle = ink.paper;
    ctx.fillRect(0, 0, W, H);
    if (!g) return;

    ctx.save();
    if (g.shake) ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);

    // Registration marks and sheet number, printed in the margin.
    ctx.strokeStyle = ink.muted; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
    for (const [x, y] of [[14, 30], [W - 14, 30]]) {
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = ink.muted;
    ctx.font = "600 11px 'Barlow Condensed', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`SHEET ${String(g.level).padStart(2, "0")}  ·  PINK / BLUE / YELLOW`, W / 2, 34);

    for (const k of g.bricks) {
      const under = k.ink === "blue" ? "pink" : k.ink === "pink" ? "blue" : "pink";
      print(rect(k.x, k.y, k.w, k.h), k.ink, under, 1.4);
      if (k.hp < k.max) halftone(k);
    }

    for (const d of g.drops) {
      print(rect(d.x - 14, d.y - 8, 28, 16, 8), "blue", "pink");
      ctx.fillStyle = ink.paper;
      ctx.font = "700 12px 'Barlow Condensed', sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(d.type, d.x, d.y + 1);
      ctx.textBaseline = "alphabetic";
    }

    for (const s of g.bits) {
      ctx.globalAlpha = Math.max(0, s.life * 1.6);
      ctx.fillStyle = ink[s.ink];
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    const p = g.paddle;
    print(rect(p.x - p.w / 2, PY, p.w, PH, 5.5), "yellow", "blue", 2);
    for (const b of g.balls) print(disc(b.x, b.y, R), "blue", "pink", 1.8);

    // Thumb zone hint under the paddle.
    ctx.fillStyle = ink.muted;
    ctx.globalAlpha = 0.5;
    ctx.font = "600 11px 'Barlow Condensed', sans-serif";
    ctx.fillText(mode === "serve" ? "TAP TO LAUNCH  ·  DRAG TO MOVE" : "DRAG HERE", W / 2, H - 28);
    if (g.paddle.wideUntil || g.slowUntil) {
      const on = [g.paddle.wideUntil && "WIDE", g.slowUntil && "SLOW"].filter(Boolean).join(" + ");
      ctx.fillText(on, W / 2, H - 46);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.drawImage(grain, 0, 0);
  }

  // ---------- Loop ----------
  let last = 0;
  function frame(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0);
    last = t;
    if (mode === "play" || mode === "serve") step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  function hud() {
    $("score").textContent = g.score;
    $("level").textContent = g.level;
    $("lives").innerHTML = "<i></i>".repeat(Math.max(0, g.lives));
    $("lives").setAttribute("aria-label", `${g.lives} balls left`);
  }

  function show(title, html, button, legend) {
    $("ov-title").textContent = title;
    $("ov-text").innerHTML = html;
    $("ov-go").textContent = button;
    $("legend").hidden = !legend;
    $("overlay").hidden = false;
    $("ov-go").focus({ preventScroll: true });
  }
  const hide = () => { $("overlay").hidden = true; };

  $("ov-go").addEventListener("click", () => {
    unlockAudio();
    hide();
    if (mode === "title" || mode === "over") { newGame(); hud(); mode = "serve"; }
    else if (mode === "clear") { g.level++; mode = "serve"; buildLevel(); hud(); }
    else if (mode === "paused") { mode = g.balls.some((b) => b.stuck) ? "serve" : "play"; }
  });

  function pause() {
    if (mode !== "play" && mode !== "serve") return;
    mode = "paused";
    show("Paused", `Level ${g.level}, score <strong>${g.score}</strong>.`, "Resume", true);
  }
  $("pause").addEventListener("click", pause);
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  function syncSound() {
    $("sound").setAttribute("aria-pressed", String(!muted));
    $("sound").setAttribute("aria-label", muted ? "Sound off" : "Sound on");
    $("sound-icon").setAttribute("d", muted
      ? "M2 6h3l4-3v10l-4-3H2zM10.5 5.5l1 -1 1.5 1.5 1.5-1.5 1 1L14 7l1.5 1.5-1 1L13 8l-1.5 1.5-1-1L12 7z"
      : "M2 6h3l4-3v10l-4-3H2zM11 5.5c1 .7 1.5 1.5 1.5 2.5s-.5 1.8-1.5 2.5l-.8-.9c.6-.5.9-1 .9-1.6s-.3-1.1-.9-1.6z");
  }
  $("sound").addEventListener("click", () => { muted = !muted; unlockAudio(); syncSound(); persist(); });

  // Paddle follows the finger horizontally anywhere on the stage.
  const toLogicalX = (clientX) => (clientX - canvas.getBoundingClientRect().left) / scale;
  let downAt = null;
  stage.addEventListener("pointerdown", (e) => {
    if (!$("overlay").hidden) return;
    unlockAudio();
    downAt = { x: e.clientX, y: e.clientY, t: performance.now() };
    g.paddle.x = toLogicalX(e.clientX);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!g || !$("overlay").hidden) return;
    if (e.pointerType === "mouse" || downAt) g.paddle.x = toLogicalX(e.clientX);
  });
  stage.addEventListener("pointerup", () => {
    if (mode === "serve" && downAt) launch();
    downAt = null;
  });
  stage.addEventListener("pointercancel", () => { downAt = null; });
  stage.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  const held = new Set();
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { held.add(e.key); e.preventDefault(); }
    if (e.key === " " && mode === "serve") { e.preventDefault(); launch(); }
    if (e.key === "p" || e.key === "Escape") pause();
  });
  document.addEventListener("keyup", (e) => held.delete(e.key));
  setInterval(() => {
    if (!g || (mode !== "play" && mode !== "serve")) return;
    if (held.has("ArrowLeft")) g.paddle.x -= 7;
    if (held.has("ArrowRight")) g.paddle.x += 7;
  }, 16);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Theme changes repaint the inks.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readInks);
  new MutationObserver(readInks).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  new ResizeObserver(resize).observe(stage);
  document.fonts?.ready.then(draw);

  function boot(data) {
    readInks();
    syncSound();
    if (data && data.g) {
      newGame(data.g);
      mode = "paused";
      show("Paused", `Level ${g.level}, score <strong>${g.score}</strong>.`, "Resume", true);
    } else {
      newGame();
      mode = "title";
    }
    hud();
    resize();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ g: g && { level: g.level, score: g.score, lives: g.lives } }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
<!-- ARTIFACT-END -->
</body>
</html>
